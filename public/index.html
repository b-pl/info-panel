<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=600, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E-Ink Dashboard</title>
    <style>
        /* Reset margins & strict black/white contrast for E-Ink */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Continuous canvas layout matching 600x800 resolution */
        #dashboard-container {
            position: relative;
            width: 600px;
            height: 800px;
            background-color: #ffffff;
            overflow: hidden;
        }

        /* Background PNG generated by Cloud Run server */
        #dashboard-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 600px;
            height: 800px;
            display: block;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Local HTML Clock overlay positioned in reserved header area */
        #clock-overlay {
            position: absolute;
            top: 17px;
            left: 20px;
            font-size: 36px;
            font-weight: 700;
            line-height: 1;
            color: #000000;
            letter-spacing: -0.5px;
            user-select: none;
            z-index: 10;
        }

        /* Offline indicator icon/badge when Wi-Fi or server fails */
        #offline-badge {
            display: none;
            position: absolute;
            top: 18px;
            left: 140px;
            font-size: 16px;
            font-weight: bold;
            background-color: #000000;
            color: #ffffff;
            padding: 2px 8px;
            border-radius: 4px;
            z-index: 11;
        }
    </style>
</head>
<body>

    <div id="dashboard-container">
        <!-- Background image served by Cloud Run with Cache-Busting -->
        <img id="dashboard-bg" src="/api/dashboard.png" alt="Dashboard Background" />

        <!-- Local client clock overlay -->
        <div id="clock-overlay">00:00</div>

        <!-- Offline state indicator -->
        <div id="offline-badge">⚠️ Offline</div>
    </div>

    <script>
        (function() {
            const clockEl = document.getElementById('clock-overlay');
            const bgImgEl = document.getElementById('dashboard-bg');
            const offlineBadgeEl = document.getElementById('offline-badge');

            const BACKGROUND_REFRESH_INTERVAL_MS = 15 * 60 * 1000; // 15 minut

            // 1. Aktualizacja zegara z zabezpieczeniem przed niepotrzebnym przerysem DOM (DOM Guard)
            function updateLocalClock() {
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const formattedTime = `${hours}:${minutes}`;

                // Modyfikujemy DOM TYLKO wtedy, gdy tekst faktycznie uległ zmianie!
                if (clockEl.textContent !== formattedTime) {
                    clockEl.textContent = formattedTime;
                }
            }

            // 2. Precyzyjna synchronizacja do przełomu minuty
            function scheduleClockUpdates() {
                updateLocalClock(); // Natychmiastowe ustawienie zegara po załadowaniu

                const now = new Date();
                // Obliczamy dokładny czas (w ms) do najbliższej pełnej minuty (00 sekund)
                const msUntilNextMinute = (60 - now.getSeconds()) * 1000 - now.getMilliseconds();

                // Czekamy do najbliższego przełomu minuty...
                setTimeout(function() {
                    updateLocalClock();
                    // ...a potem odświeżamy zegar dokładnie co 60 sekund (60 000 ms)
                    setInterval(updateLocalClock, 60000);
                }, msUntilNextMinute);
            }

            // 3. Pobieranie tła PNG z serwera (mechanizm Cache-Busting ?t=timestamp)
            function refreshDashboardImage() {
                const timestamp = new Date().getTime();
                bgImgEl.src = `/api/dashboard.png?t=${timestamp}`;
            }

            // Obsługa stanu połączenia dla E-Ink
            bgImgEl.addEventListener('load', function() {
                offlineBadgeEl.style.display = 'none';
            });

            bgImgEl.addEventListener('error', function() {
                offlineBadgeEl.style.display = 'inline-block';
            });

            // Uruchomienie zoptymalizowanego zegara
            scheduleClockUpdates();

            // Uruchomienie cyklicznego pobierania tła z GCP co 15 minut
            setInterval(refreshDashboardImage, BACKGROUND_REFRESH_INTERVAL_MS);
        })();
    </script>
</body>
</html>
